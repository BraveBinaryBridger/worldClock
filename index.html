<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css"></link>
    <title>World clock</title>
</head>
<body>
    <div class="container">
        <h1>World clock</h1>

        <select name="" id="">
            <option value="">Select</option>
            <option value="1">London</option>
            <option value="2">Barcelona</option>
            <option value="3">Tokio</option>

        </select>
    
        <div class="city">
            <h2>Sydney</h2>
            <div class="date">September 27th 2025</div>
            <div class="time">12:12:12 PM</div>
        </div>
        <div class="city">
            <h2>Istanbul</h2>
            <div class="date">September 27th 2025</div>
            <div class="time">12:12:12 PM</div>
        </div>
    </div>

    <footer>
        This was coded by <a href="https://bravebinarybridger.github.io/" target="_blank">Hanna</a> 
        and open sourced on <a href="https://github.com/BraveBinaryBridger/worldClock.git" target="_blank">GitHub</a>
    </footer>
    <script src="js/index.js"></script>
</body>
</html>
