<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css"></link>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
    
    <title>World clock</title>
</head>
<body>
    <div class="container">
        <h1><a href="/">World clock</a></h1>

        <select name="" id="">
            <option value="">Select</option>
            <option value="1">London</option>
            <option value="2">Barcelona</option>
            <option value="3">Tokio</option>

        </select>
    
        <div class="city" id="sydney">
            <div>
                <h2>Sydney</h2>
                <div class="date"></div>
            </div>
            <div class="time"></div>
        </div>
        <div class="city" id="istanbul">
            <div>
                <h2>Istanbul</h2>
                <div class="date"></div>
            </div>
            <div class="time"></div>
        </div>
        <div class="city" id="berlin">
            <div>
                <h2>Berlin</h2>
                <div class="date"></div>
            </div>
            <div class="time"></div>
        </div>
        <a href="/">Back</a>
    </div>

    <footer>
        This was coded by <a href="https://bravebinarybridger.github.io/" target="_blank"><strong>Hanna</strong></a> 
        and open sourced on <a href="https://github.com/BraveBinaryBridger/worldClock.git" target="_blank">GitHub</a>
    </footer>
    <script src="js/index.js"></script>
</body>
</html>
